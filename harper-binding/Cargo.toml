[package]
name = "harper-binding"
version = "0.1.0"
edition = "2021"

[lib]
name = "harper_binding"
crate-type = ["cdylib"]
path = "src/main/rust/binding.rs"

[dependencies]
jni = "0.21"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
harper-core = "1.5.1"
lazy_static = "1.5.0"