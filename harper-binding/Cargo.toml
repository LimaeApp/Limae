[package]
name = "harper-binding"
version = "0.1.0"
edition = "2021"

[lib]
name = "harper_binding"
crate-type = ["cdylib"]
path = "src/jvmAndAndroidMain/rust/binding.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
harper-core = "1.5.1"
lazy_static = "1.5.0"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
jni = "0.21"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
console_error_panic_hook = "0.1"

getrandom = { version = "0.3", features = ["wasm_js"] }